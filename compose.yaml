services:
  mongo:
    image: docker.io/library/mongo:8.0
    # One local server; each application profile selects its own database via MONGODB_URL.
    ports:
      - "${MONGO_BIND_HOST:?Set MONGO_BIND_HOST}:${MONGO_PORT:?Set MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-secure-data:/data/db

volumes:
  mongo-secure-data:
